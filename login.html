<!doctype html>
<html lang="en-GB" dir="ltr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Log in to Skyscanner | User &amp; Admin Sign In</title>
  <meta name="description" content="Sign in to your Skyscanner account to manage bookings, view saved flights, or access admin controls." />

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/navbar.css" />
  <link rel="stylesheet" href="styles/auth.css" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 10% 20%, #05203C 0%, #02122c 90%);
      color: #fff;
    }

    .login-page-header {
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      padding: 36px 32px;
      color: var(--sk-text-primary);
      animation: modalPop 0.3s ease-out;
    }

    .login-brand-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--sk-navy-main);
      text-align: center;
      margin-bottom: 6px;
    }

    .login-brand-subtitle {
      font-size: 0.88rem;
      color: var(--sk-text-secondary);
      text-align: center;
      margin-bottom: 24px;
    }

    .login-footer-links {
      margin-top: 24px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--sk-text-muted);
    }

    .login-footer-links a {
      color: var(--sk-blue-primary);
      text-decoration: none;
      font-weight: 600;
    }

    .login-footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- Top Simple Navigation Header -->
  <header class="login-page-header">
    <a href="index.html" class="brand-logo-link" aria-label="Skyscanner Homepage">
      <svg class="brand-icon-svg" viewBox="0 0 40 40" style="width: 32px; height: 32px;">
        <circle cx="20" cy="20" r="18" fill="#0062E3" />
        <path d="M20 7L24 16L33 20L24 24L20 33L16 24L7 20L16 16Z" fill="#FFFFFF" />
        <circle cx="20" cy="20" r="4" fill="#00A698" />
      </svg>
      <span class="brand-text">Skyscanner<span>.</span></span>
    </a>

    <a href="index.html" class="nav-action-btn" style="text-decoration: none;">
      <span>← Back to Flights</span>
    </a>
  </header>

  <!-- Login Card Container -->
  <main class="login-container">
    <div class="login-card">
      <h1 class="login-brand-title">Sign in to Skyscanner</h1>
      <p class="login-brand-subtitle">Compare flights, save routes, and access exclusive travel features</p>

      <!-- Role Switcher -->
      <div class="auth-role-tabs">
        <button type="button" class="auth-role-tab active" id="tab-user-role">
          <span>👤</span>
          <span>User / Traveller</span>
        </button>
        <button type="button" class="auth-role-tab admin-tab" id="tab-admin-role">
          <span>🛡️</span>
          <span>Admin Portal</span>
        </button>
      </div>

      <!-- Google OAuth Sign In Button -->
      <button type="button" class="btn-google-oauth" id="btn-login-page-google">
        <svg class="google-icon-svg" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign in with Google Mail (OAuth)</span>
      </button>

      <div class="auth-divider">
        <span>or sign in with email</span>
      </div>

      <!-- Email Login Form -->
      <form id="login-page-form">
        <div id="page-auth-error" style="display: none; background: #FFEBEE; color: #C62828; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.84rem; font-weight: 600; margin-bottom: 14px;"></div>

        <div class="auth-form-group">
          <label class="auth-form-label" for="page-email" id="label-email">Email Address</label>
          <input type="email" id="page-email" class="auth-input" placeholder="name@domain.com" required />
        </div>

        <div class="auth-form-group">
          <label class="auth-form-label" for="page-password">Password</label>
          <input type="password" id="page-password" class="auth-input" placeholder="Enter password" required />
        </div>

        <div class="auth-form-group" id="admin-key-group" style="display: none;">
          <label class="auth-form-label" for="page-admin-key">Secret Admin Key</label>
          <input type="password" id="page-admin-key" class="auth-input" placeholder="Enter secret administrator key" />
        </div>

        <button type="submit" class="btn btn-primary" id="btn-submit-login" style="width: 100%; padding: 12px; margin-top: 14px; font-size: 0.95rem;">
          <span>Sign In as User ➔</span>
        </button>
      </form>

      <div class="login-footer-links">
        By continuing, you agree to Skyscanner's <a href="index.html">Terms of Service</a> &amp; <a href="index.html">Privacy Policy</a>.
      </div>
    </div>
  </main>

  <!-- Interactive Google OAuth Picker Overlay -->
  <div class="google-oauth-picker-overlay" id="google-oauth-picker"></div>

  <script type="module">
    import { Auth } from './js/auth.js';
    import { openGoogleAccountPicker } from './js/auth-ui.js';

    let currentRole = 'user';

    const tabUser = document.getElementById('tab-user-role');
    const tabAdmin = document.getElementById('tab-admin-role');
    const emailInput = document.getElementById('page-email');
    const passInput = document.getElementById('page-password');
    const keyGroup = document.getElementById('admin-key-group');
    const keyInput = document.getElementById('page-admin-key');
    const submitBtn = document.getElementById('btn-submit-login');
    const errBox = document.getElementById('page-auth-error');

    function setRole(role) {
      currentRole = role;
      if (role === 'admin') {
        tabAdmin.classList.add('active');
        tabUser.classList.remove('active');
        keyGroup.style.display = 'flex';
        emailInput.value = '';
        passInput.value = '';
        keyInput.value = '';
        emailInput.placeholder = 'admin@company.com';
        submitBtn.innerHTML = '<span>Sign In as Admin 🛡️</span>';
      } else {
        tabUser.classList.add('active');
        tabAdmin.classList.remove('active');
        keyGroup.style.display = 'none';
        emailInput.value = '';
        passInput.value = '';
        keyInput.value = '';
        emailInput.placeholder = 'name@domain.com';
        submitBtn.innerHTML = '<span>Sign In as User ➔</span>';
      }
    }

    tabUser.addEventListener('click', () => setRole('user'));
    tabAdmin.addEventListener('click', () => setRole('admin'));

    // Google Sign in
    document.getElementById('btn-login-page-google').addEventListener('click', () => {
      openGoogleAccountPicker(currentRole);
    });

    // Form submit
    document.getElementById('login-page-form').addEventListener('submit', (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      try {
        Auth.loginWithEmail(emailInput.value, passInput.value, currentRole, keyInput.value);
        window.location.href = 'index.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
      }
    });

    // Auto-detect if user signed in via Google picker
    Auth.subscribe((user) => {
      if (user) {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>

</html>
